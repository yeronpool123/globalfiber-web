<section class="globalfiber-tech-map-section">
  <div class="tech-map-wrapper">
    
    <div class="tech-map-header">
      <span class="tech-map-badge">BACKBONE GLOBAL</span>
      <h2 class="tech-map-title">Conectividad Internacional Submarina</h2>
      <p class="tech-map-subtitle">
        Infraestructura Carrier-Grade interconectada de forma redundante con las principales estaciones de amarre de cables y anillos de fibra a nivel global.
      </p>
    </div>

    <div class="tech-map-viewport" id="cyber-map-trigger">
      <div class="tech-map-overlay">
        <span class="tech-map-radar"></span>
        <button class="tech-map-btn">
          <i class="ph ph-magnifying-glass-plus"></i> Expandir Mapa Técnico
        </button>
      </div>
      <img src="assets/images/mapa-cobertura.jpg" alt="Mapa de Infraestructura GlobalFiber" class="tech-map-img">

<div class="tech-lightbox-backdrop" id="map-modal">  
  <div class="zoom-controls-toolbar">
    <button id="btn-zoom-in" title="Acercar"><i class="ph ph-plus"></i></button>
    <button id="btn-zoom-reset" title="Restablecer Vista">100%</button>
    <button id="btn-zoom-out" title="Alejar"><i class="ph ph-minus"></i></button>
  </div>

  <button class="tech-lightbox-close" id="close-map-modal">&times;</button>
  
  <div class="tech-lightbox-content">
    <img src="assets/images/mapa-cobertura.jpg" alt="Mapa Técnico Expandido" class="tech-lightbox-img" id="modal-target-img">
  </div>
</div>
